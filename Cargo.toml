[package]
name = "insta"
version = "0.1.0"
edition = "2024"
description = "Local MCP server that lets Claude triage and answer your Instagram DMs, as you"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "multipart"] }
rmcp = { version = "3.8.0", features = ["server", "macros", "transport-streamable-http-server"] }
rpassword = "7"
rusqlite = { version = "0.41", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "process", "io-util", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
url = "2"
wiremock = "0.6"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
